name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish (0.0.x)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Verify release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const requested = process.env.RELEASE_VERSION;
          if (process.env.GITHUB_REF !== 'refs/heads/main' ||
              name !== 'plugnz' ||
              !/^0\.0\.[1-9]\d*$/.test(requested) ||
              requested !== version) {
            console.error('Publish requires main and a matching, nonzero 0.0.x package version.');
            process.exit(1);
          }
          NODE
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.14.1
      - name: Publish
        run: npm publish --access public --ignore-scripts
